<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio inbox</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><div><p class="eyebrow">Marshall Presson</p><h1>Portfolio inbox</h1><p>Messages and opportunities from your website.</p></div><button id="logout" hidden>Sign out</button></header>
<section id="login"><h2>Sign in</h2><form id="login-form"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Open inbox</button></form></section>
<section id="inbox" hidden><div class="row"><h2>Messages</h2><button id="refresh">Refresh</button></div><p class="muted">Showing the latest 200 messages. Use Reply to continue the conversation in your email app.</p><div id="messages"></div></section><p id="notice" role="status"></p></main></body></html>
